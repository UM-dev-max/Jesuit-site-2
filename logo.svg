<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#f6e3a3"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6d15"/>
    </radialGradient>
    <radialGradient id="medGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#8f1d21"/>
      <stop offset="70%" stop-color="#5c0a14"/>
      <stop offset="100%" stop-color="#3a0509"/>
    </radialGradient>
  </defs>

  <!-- rays -->
  <g fill="url(#goldGrad)">
    <g id="rayGroup">
      <path d="M100 4 L106 40 L94 40 Z"/>
    </g>
    <use href="#rayGroup" transform="rotate(30 100 100)"/>
    <use href="#rayGroup" transform="rotate(60 100 100)"/>
    <use href="#rayGroup" transform="rotate(90 100 100)"/>
    <use href="#rayGroup" transform="rotate(120 100 100)"/>
    <use href="#rayGroup" transform="rotate(150 100 100)"/>
    <use href="#rayGroup" transform="rotate(180 100 100)"/>
    <use href="#rayGroup" transform="rotate(210 100 100)"/>
    <use href="#rayGroup" transform="rotate(240 100 100)"/>
    <use href="#rayGroup" transform="rotate(270 100 100)"/>
    <use href="#rayGroup" transform="rotate(300 100 100)"/>
    <use href="#rayGroup" transform="rotate(330 100 100)"/>
  </g>

  <!-- outer gold ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- medallion -->
  <circle cx="100" cy="100" r="58" fill="url(#medGrad)" stroke="#e8d5a0" stroke-width="1.5"/>

  <!-- IHS monogram -->
  <g fill="#f2e3ae" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="100" y="122" font-size="52" letter-spacing="2">IHS</text>
  </g>

  <!-- cross above the H -->
  <g stroke="#f2e3ae" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="56" x2="100" y2="76"/>
    <line x1="92" y1="63" x2="108" y2="63"/>
  </g>

  <!-- three nails below -->
  <g stroke="#f2e3ae" stroke-width="2.5" stroke-linecap="round">
    <line x1="82" y1="140" x2="76" y2="156"/>
    <line x1="100" y1="142" x2="100" y2="160"/>
    <line x1="118" y1="140" x2="124" y2="156"/>
  </g>
</svg>
