<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — Society of Jesus</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar main">
  <a class="back-link" href="main.html">&larr; Main Menu</a>
  <div class="brand">
    <img src="assets/logo.svg" alt="Society of Jesus seal" style="width:38px;height:38px;">
    <span class="script" style="font-size:1.4rem;">Society of Jesus</span>
  </div>
</div>

<div class="container" id="container">
  <div class="empty">Loading news...</div>
</div>

<script src="js/app.js"></script>
<script>
  requireAuth();
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const db = loadDB();
  const item = db.news.find(n => n.id === id);
  const container = document.getElementById('container');

  if(!item){
    container.innerHTML = `<div class="empty">This news item could not be found.</div>`;
  } else {
    const imagesHTML = (item.images || []).map(src => `<img src="${src}" alt="">`).join('');
    const linksHTML = (item.links || []).map(l => `<p><a href="${l.url}" target="_blank" rel="noopener">${escapeHTML(l.label || l.url)}</a></p>`).join('');
    container.innerHTML = `
      <div class="panel" style="animation:riseIn .5s ease both;">
        ${item.urgent ? '<span class="badge-urgent" style="position:static;display:inline-block;margin-bottom:10px;">Urgent</span>' : ''}
        <h1>${escapeHTML(item.title)}</h1>
        <p style="color:#8a7360;font-size:.9rem;">
          ${isExpired(item.expiresAt) ? 'Expired' : 'Expires'} ${fmtDate(item.expiresAt)}
        </p>
        ${imagesHTML}
        <p style="white-space:pre-wrap;">${escapeHTML(item.details || item.summary || '')}</p>
        ${linksHTML}
      </div>`;
  }

  renderFooter();
</script>

</body>
</html>
