<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll — Society of Jesus</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar main">
  <a class="back-link" href="main.html">&larr; Main Menu</a>
  <div class="brand">
    <img src="assets/logo.svg" alt="Society of Jesus seal" style="width:38px;height:38px;">
    <span class="script" style="font-size:1.4rem;">Society of Jesus</span>
  </div>
</div>

<div class="container" id="container">
  <div class="empty">Loading poll...</div>
</div>

<script src="js/app.js"></script>
<script>
  const user = requireAuth();
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const db = loadDB();
  const poll = db.polls.find(p => p.id === id);
  const container = document.getElementById('container');

  function renderResults(poll){
    const total = poll.votes.length;
    const counts = poll.options.map((_, i) => poll.votes.filter(v => v.optionIndex === i).length);
    const rows = poll.options.map((opt, i) => {
      const pct = total ? Math.round((counts[i] / total) * 100) : 0;
      return `
        <div style="margin:12px 0;">
          <div class="row" style="justify-content:space-between;">
            <span>${escapeHTML(opt)}</span>
            <span>${poll.showPercentage ? pct + '%' : counts[i] + ' vote(s)'}</span>
          </div>
          <div style="background:var(--parchment); border-radius:6px; overflow:hidden; height:10px;">
            <div style="width:${pct}%; background:linear-gradient(90deg,var(--gold),var(--crimson)); height:100%;"></div>
          </div>
        </div>`;
    }).join('');
    return rows;
  }

  if(!poll){
    container.innerHTML = `<div class="empty">This poll could not be found.</div>`;
  } else {
    const myVote = poll.votes.find(v => v.username === user);
    const expired = isExpired(poll.expiresAt);

    if(myVote || expired){
      container.innerHTML = `
        <div class="panel">
          <h1>${escapeHTML(poll.title)}</h1>
          <p style="font-size:.85rem;color:#8a7360;">${expired ? 'Closed' : 'Closes'} ${fmtDate(poll.expiresAt)} ${poll.anonymous ? '&middot; Anonymous poll' : ''}</p>
          ${myVote ? '<p>Your vote has been recorded. Thank you.</p>' : ''}
          ${renderResults(poll)}
        </div>`;
    } else {
      const opts = poll.options.map((o, i) => `
        <label style="display:block;margin:8px 0;">
          <input type="radio" name="opt" value="${i}" required> ${escapeHTML(o)}
        </label>`).join('');

      container.innerHTML = `
        <div class="panel">
          <h1>${escapeHTML(poll.title)}</h1>
          <p style="font-size:.85rem;color:#8a7360;">Closes ${fmtDate(poll.expiresAt)} ${poll.anonymous ? '&middot; Your choice will not be shown publicly' : ''}</p>
          <form id="pollForm" class="form-grid">${opts}<button type="submit" class="btn full">Cast Vote</button></form>
        </div>`;

      document.getElementById('pollForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = Number(e.target.opt.value);
        const fresh = loadDB();
        const freshPoll = fresh.polls.find(p => p.id === poll.id);
        freshPoll.votes = freshPoll.votes || [];
        freshPoll.votes.push({ username: user, optionIndex: val });
        saveDB(fresh);
        location.reload();
      });
    }
  }

  renderFooter();
</script>

</body>
</html>
